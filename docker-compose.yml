services:
  app:
    build:
      context: .
      args:
        GITLAB_TOKEN: ${GITLAB_TOKEN}
        NEXT_PUBLIC_GITLAB_GROUP_PATH: ${NEXT_PUBLIC_GITLAB_GROUP_PATH}
        NEXT_PUBLIC_GITLAB_ISSUE_BASE_URL: ${NEXT_PUBLIC_GITLAB_ISSUE_BASE_URL}
        GITLAB_API_URL: ${GITLAB_API_URL:-https://gitlab.com/api/graphql}
        NEXT_PUBLIC_START_DATE: ${NEXT_PUBLIC_START_DATE}
        NEXT_PUBLIC_END_DATE: ${NEXT_PUBLIC_END_DATE}
        NEXT_PUBLIC_PROJECT_NAME: ${NEXT_PUBLIC_PROJECT_NAME}
    environment:
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      NEXT_PUBLIC_GITLAB_GROUP_PATH: ${NEXT_PUBLIC_GITLAB_GROUP_PATH}
      NEXT_PUBLIC_GITLAB_ISSUE_BASE_URL: ${NEXT_PUBLIC_GITLAB_ISSUE_BASE_URL}
      GITLAB_API_URL: ${GITLAB_API_URL:-https://gitlab.com/api/graphql}
      NEXT_PUBLIC_START_DATE: ${NEXT_PUBLIC_START_DATE}
      NEXT_PUBLIC_END_DATE: ${NEXT_PUBLIC_END_DATE}
      NEXT_PUBLIC_PROJECT_NAME: ${NEXT_PUBLIC_PROJECT_NAME}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD}
    networks:
      - global-postgres-net
    ports:
      - "3000:3000"
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: clf-segld
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - global-postgres-net

networks:
  global-postgres-net:
    external: true
